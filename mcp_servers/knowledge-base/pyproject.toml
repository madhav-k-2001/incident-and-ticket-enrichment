[project]
name = "knowledge-base-mcp"
version = "0.1.0"
description = "MCP server exposing the pgvector RAG knowledge base (SOPs, KB articles, troubleshooting guides) as tools and resources"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2.0",
    "asyncpg>=0.30.0",
    "google-genai>=1.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
]

[project.scripts]
knowledge-base-mcp = "kb_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
