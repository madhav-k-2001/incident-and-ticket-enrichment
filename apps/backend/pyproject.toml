[project]
name = "incident-and-ticket-enrichment-backend"
version = "0.1.0"
description = "Incident & Ticket Enrichment Copilot backend"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.142.1",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "openai-agents>=0.22.3",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "pytest-asyncio>=1.4.0",
    "sqlalchemy>=2.1.1",
    "streamlit>=1.64.0",
]

[tool.pytest.ini_options]
# Imports are rooted at the repo root (apps.backend...), two levels up.
pythonpath = ["../.."]
testpaths = ["../../tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]
