# Full stack from the repo root: alarm/ticketing simulator, the 3 MCP servers
# (streamable-http) and the backend API + chat UI. All services use the single
# Neon database configured in .env (copy .env.sample to .env first).
#
#   docker compose up --build
#
# Host endpoints:
#   Backend API + UI -> http://localhost:8200  (UI at /ui/)
#   Simulator API    -> http://localhost:8000
#   Alarm MCP        -> http://localhost:8101/mcp
#   Ticketing MCP    -> http://localhost:8102/mcp
#   Knowledge MCP    -> http://localhost:8103/mcp

name: incident-enrichment

services:
  alarm-simulator:
    build:
      context: ./apps/alarms_and_ticket_simulation_api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  alarm-mcp:
    build:
      context: ./mcp_servers/alarm-management
    ports:
      - "9101:8100"
    environment:
      ALARM_API_BASE_URL: http://alarm-simulator:8000
      ALARM_API_TOKEN: ${ALARM_API_TOKEN:-demo-token}
      ALARM_API_TIMEOUT_SECONDS: ${ALARM_API_TIMEOUT_SECONDS:-10}
      ALARM_API_MAX_RETRIES: ${ALARM_API_MAX_RETRIES:-2}
      ALARM_API_CLIENT_ID: ${ALARM_API_CLIENT_ID:-alarm-mcp-server}
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8100
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      alarm-simulator:
        condition: service_healthy
    restart: unless-stopped

  ticketing-mcp:
    build:
      context: ./mcp_servers/ticketing
    ports:
      - "9102:8100"
    environment:
      TICKETING_API_BASE_URL: http://alarm-simulator:8000
      TICKETING_API_TOKEN: ${TICKETING_API_TOKEN:-demo-token}
      TICKETING_TIMEOUT_SECONDS: ${TICKETING_TIMEOUT_SECONDS:-10}
      TICKETING_MAX_RETRIES: ${TICKETING_MAX_RETRIES:-2}
      TICKETING_RETRY_BACKOFF_SECONDS: ${TICKETING_RETRY_BACKOFF_SECONDS:-0.5}
      TICKETING_CLIENT_ID: ${TICKETING_CLIENT_ID:-ticketing-mcp}
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8100
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      alarm-simulator:
        condition: service_healthy
    restart: unless-stopped

  knowledge-base-mcp:
    build:
      context: ./mcp_servers/knowledge-base
    ports:
      - "9103:8100"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_COMMAND_TIMEOUT_SECONDS: ${DB_COMMAND_TIMEOUT_SECONDS:-10}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2-preview}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-15}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-2}
      MAX_DOCUMENT_CHUNKS: ${MAX_DOCUMENT_CHUNKS:-2000}
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8100
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "9200:8200"
    env_file:
      - .env
    environment:
      # Container-network MCP endpoints (override the localhost config in .env)
      MCP_SERVERS_CONFIG: /app/apps/backend/mcp_servers.docker.json
    depends_on:
      - alarm-mcp
      - ticketing-mcp
      - knowledge-base-mcp
    restart: unless-stopped
