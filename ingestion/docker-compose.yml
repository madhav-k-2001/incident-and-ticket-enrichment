services:
  redis:
    image: redis:7-alpine
    container_name: ingestion_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: ingestion_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/app
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: ingestion_worker
    restart: unless-stopped
    command: python -m worker.worker
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/app
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redisdata:
  uploads_data:
