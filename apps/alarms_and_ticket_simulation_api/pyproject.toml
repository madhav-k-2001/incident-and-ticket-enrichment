[project]
name = "alarm-and-ticketing-simulator"
version = "0.1.0"
description = "Alarm Management API Simulator and Ticketing Service for Copilot Integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
