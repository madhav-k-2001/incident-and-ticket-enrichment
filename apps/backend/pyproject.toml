[project]
name = "incident-and-ticket-enrichment-backend"
version = "0.1.0"
description = "Incident & Ticket Enrichment Copilot backend"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.142.1",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "openai-agents>=0.22.3",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "pytest-asyncio>=1.4.0",
    "sqlalchemy>=2.1.1",
    "streamlit>=1.64.0",
]

[tool.pytest.ini_options]
# Imports are rooted at the repo root (apps.backend...), two levels up.
pythonpath = ["../.."]
testpaths = ["../../tests", "../../scripts/test_agent_service.py"]
asyncio_mode = "auto"
# End-to-end tests need a real running API, so they are off by default; opt in with `-m e2e`.
addopts = "-m 'not e2e'"
markers = [
    "e2e: end-to-end test against a real running backend (needs E2E_BASE_URL); excluded from the default run",
    "llm: e2e test that runs a real agent turn (needs OPENAI_API_KEY on the server, costs tokens)",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]
